spring.application.name=UniDoc

spring.datasource.url=${UNIDOC_DB_URL}
spring.datasource.username=${UNIDOC_DB_USERNAME}
spring.datasource.password=${UNIDOC_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

app.jwt.secret=${UNIDOC_JWT_SECRET}
app.jwt.expiration-seconds=${UNIDOC_JWT_EXPIRATION_SECONDS:3600}
app.cors.allowed-origins=${UNIDOC_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${UNIDOC_FRONTEND_URL:http://localhost:5173}

app.storage.root=${UNIDOC_STORAGE_ROOT:./data/uploads}
app.storage.supporting-max-bytes=${UNIDOC_SUPPORTING_MAX_BYTES:5242880}
app.storage.issued-max-bytes=${UNIDOC_ISSUED_MAX_BYTES:10485760}

app.email.enabled=${UNIDOC_EMAIL_ENABLED:false}
app.email.from=${UNIDOC_EMAIL_FROM:}

spring.mail.host=${UNIDOC_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${UNIDOC_SMTP_PORT:587}
spring.mail.username=${UNIDOC_SMTP_USERNAME:}
spring.mail.password=${UNIDOC_SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${UNIDOC_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${UNIDOC_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.demo.seed-enabled=${UNIDOC_SEED_DEMO:false}
app.demo.reset-enabled=${UNIDOC_RESET_DEMO:false}
app.demo.reset-confirmation=${UNIDOC_RESET_CONFIRMATION:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
